spring:
  application:
    name: support-tickets
  # Secrets live in the git-ignored .env at the repo root (or in real environment variables).
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tickets}
    username: ${DB_USERNAME:tickets}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  # Re-indexing runs inside the user's request (OQ-12), so provider calls must fail fast. Spring AI's
  # default retry is 10 attempts with 2s x5 backoff up to 180s (~19 min) — see docs/ai-mistakes-log.md M-5.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s
  ai:
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4.1-mini
          temperature: 0.0
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

app:
  rag:
    top-k: 5
    similarity-threshold: 0.45
    chunk:
      max-tokens: 400
  seed:
    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
app:
  seed:
    enabled: true
